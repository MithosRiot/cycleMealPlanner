name: Backend Tests

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-test.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: python -m pip install -e '.[dev]'

      - name: Run migration recovery tests
        run: pytest -q tests/test_migration_recovery.py

      - name: Test active quantity reconciliation
        run: pytest -q tests/test_active_cycle_reconciliation.py::test_active_quantity_change_reconciles_reservations_shopping_and_revision_history --junitxml=active-quantity-results.xml

      - name: Upload active quantity results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active-quantity-test-results
          path: backend/active-quantity-results.xml
          if-no-files-found: ignore

      - name: Test active purchase/removal/finalized rollback
        run: pytest -q tests/test_active_cycle_reconciliation.py::test_active_removed_demand_preserves_purchase_history_and_finalized_edit_rolls_back --junitxml=active-rollback-results.xml

      - name: Upload active rollback results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active-rollback-test-results
          path: backend/active-rollback-results.xml
          if-no-files-found: ignore

      - name: Run tests
        run: pytest -q --cov=app --cov-report=term-missing

      - name: Validate populated SQLite upgrade
        run: python testdata/validate_populated_upgrade.py

      - name: Validate seeded test database
        run: python testdata/seed_test_db.py --reset

      - name: Populate use-soon fixture
        run: python testdata/seed_use_soon_fixture.py

      - name: Populate dashboard alert fixture
        run: python testdata/seed_dashboard_alert_fixture.py

      - name: Populate lifecycle fixture
        run: python testdata/seed_cycle_lifecycle_fixture.py

      - name: Populate direct Recipe fixture
        run: python testdata/seed_direct_recipe_fixture.py

      - name: Populate non-food occurrence fixture
        run: python testdata/seed_non_food_occurrence_fixture.py

      - name: Validate repeated populated seed reset
        run: python testdata/seed_test_db.py --reset
