name: Backend Tests

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-test.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: python -m pip install -e '.[dev]'

      - name: Run migration recovery tests
        run: pytest -q tests/test_migration_recovery.py

      - name: Run tests
        run: pytest -q --cov=app --cov-report=term-missing

      - name: Validate populated SQLite upgrade
        run: python testdata/validate_populated_upgrade.py

      - name: Validate seeded test database
        run: python testdata/seed_test_db.py --reset
