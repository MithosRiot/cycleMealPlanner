name: Backend Tests

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-test.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: python -m pip install -e '.[dev]'

      - name: Run migration recovery tests
        run: pytest -q tests/test_migration_recovery.py

      - name: Run active-cycle reconciliation tests
        run: pytest -q tests/test_active_cycle_reconciliation.py tests/test_active_cycle_move_add.py

      - name: Run tests
        run: pytest -q --cov=app --cov-report=term-missing

      - name: Validate populated SQLite upgrade
        run: python testdata/validate_populated_upgrade.py

      - name: Validate seeded test database
        run: python testdata/seed_test_db.py --reset

      - name: Populate use-soon fixture
        run: python testdata/seed_use_soon_fixture.py

      - name: Populate dashboard alert fixture
        run: python testdata/seed_dashboard_alert_fixture.py

      - name: Populate lifecycle fixture
        run: python testdata/seed_cycle_lifecycle_fixture.py

      - name: Populate direct Recipe fixture
        run: python testdata/seed_direct_recipe_fixture.py

      - name: Populate non-food occurrence fixture
        run: python testdata/seed_non_food_occurrence_fixture.py

      - name: Populate active-cycle reconciliation fixture
        run: |
          python testdata/seed_active_cycle_reconciliation_fixture.py
          python testdata/seed_active_cycle_reconciliation_fixture.py --verify

      - name: Populate Shopping partial/substitution fixture
        run: |
          python testdata/seed_shopping_partial_substitution_fixture.py
          python testdata/seed_shopping_partial_substitution_fixture.py --verify

      - name: Validate repeated populated seed reset
        run: python testdata/seed_test_db.py --reset
